services:
  postgres:
    image: postgres:16-alpine
    container_name: fronteratech-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fronteratech
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fronteratech"]
      interval: 10s
      timeout: 5s
      retries: 5

  fronteratech-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fronteratech-corporate-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fronteratech?schema=public
      - JWT_SECRET=fronteratech-jwt-super-secret-key-2026-production-secure
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:

